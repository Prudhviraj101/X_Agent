name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check configuration template
        run: python - <<'PY'
import pathlib
from dotenv import dotenv_values

required = {"MODEL_PROVIDER", "POST_TO_X", "SCRAPE_INTERVAL_HOURS"}
config = dotenv_values(".env.example")
missing = required - config.keys()
if missing:
    raise SystemExit(f"Missing .env.example keys: {sorted(missing)}")
print("Configuration template OK")
PY
